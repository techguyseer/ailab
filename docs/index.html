<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumi Soap | Science, Simplified.</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Open+Sans:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="logo">RUMI</div>
            <div class="nav-links">
                <a href="#ingredients">Ingredients</a>
                <a href="#gallery">Gallery</a>
                <a href="#subscribe">Subscribe</a>
            </div>
        </nav>
    </header>

    <main>
        <section id="hero" class="hero section">
            <div class="hero-content">
                <h1>SCIENCE, SIMPLIFIED.</h1>
                <a href="#ingredients" class="cta-button">Explore the Truth</a>
            </div>
            <div class="hero-image">
                <img src="https://picsum.photos/seed/minimalist/800/600" alt="Rumi Soap Product" loading="lazy">
            </div>
        </section>

        <section id="ingredients" class="section">
            <h2 class="section-title">THE INGREDIENT TRUTH</h2>
            <div class="ingredient-grid">
                <div class="ingredient-tile">
                    <img src="https://picsum.photos/seed/laboratory/400/400" alt="Laboratory">
                    <p>Pure Synthetic Base</p>
                </div>
                <div class="ingredient-tile">
                    <img src="https://picsum.photos/seed/botanical/400/400" alt="Botanical">
                    <p>Organic Botanicals</p>
                </div>
                <div class="ingredient-tile">
                    <img src="https://picsum.photos/seed/water/400/400" alt="Water">
                    <p>Deionized Water</p>
                </div>
                <div class="ingredient-tile">
                    <img src="https://picsum.photos/seed/texture/400/400" alt="Texture">
                    <p>Micronized Texturizers</p>
                </div>
            </div>
        </section>

        <section id="gallery" class="section">
            <h2 class="section-title">VISUAL PROOF</h2>
            <div class="gallery-masonry">
                <img src="https://picsum.photos/seed/shelf/600/800" alt="User Gallery 1" loading="lazy">
                <img src="https://picsum.photos/seed/bathroom/800/600" alt="User Gallery 2" loading="lazy">
                <img src="https://picsum.photos/seed/interior/600/600" alt="User Gallery 3" loading="lazy">
            </div>
        </section>

        <footer id="subscribe">
            <div class="footer-content">
                <h2>Join the Evolution.</h2>
                <form id="subscribe-form">
                    <input type="email" placeholder="Email Address" required>
                    <button type="submit">Join</button>
                </form>
                <img src="https://picsum.photos/seed/abstract/200/200" alt="Footer Accent" class="footer-accent">
            </div>
        </footer>
    </main>

    <script>
        // Intersection Observer for fade-in animations
        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('fade-in-up');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.section').forEach(section => {
            observer.observe(section);
        });

        // Form Handling
        document.getElementById('subscribe-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const input = e.target.querySelector('input');
            btn.textContent = 'Success';
            input.value = '';
            btn.disabled = true;
        });
    
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
