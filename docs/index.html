<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Shoes | Modern Brutalist Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="global-wrapper">
        <!-- Section 1: Hero -->
        <section id="hero" class="section hero">
            <div class="hero-bg">
                <img src="https://picsum.photos/seed/hero/1920/1080" alt="Hero Background" loading="eager">
            </div>
            <div class="hero-overlay">
                <h1 class="display-heading">MIRA SHOES<br>STEP INTO RAW</h1>
                <a href="#shop" class="cta-button">SHOP THE DROP</a>
            </div>
        </section>

        <hr class="heavy-rule">

        <!-- Section 2: Shop the Drop -->
        <section id="shop" class="section shop">
            <h2 class="display-heading section-title">SHOP THE DROP</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="https://picsum.photos/seed/sneaker1/800/600" alt="Sneaker 1" loading="lazy">
                    <div class="product-info">
                        <h3>SNEAKER 01</h3>
                        <p>$199.00</p>
                    </div>
                </div>
                <div class="product-card">
                    <img src="https://picsum.photos/seed/sneaker2/800/600" alt="Sneaker 2" loading="lazy">
                    <div class="product-info">
                        <h3>SNEAKER 02</h3>
                        <p>$249.00</p>
                    </div>
                </div>
                <div class="product-card">
                    <img src="https://picsum.photos/seed/sneaker3/800/600" alt="Sneaker 3" loading="lazy">
                    <div class="product-info">
                        <h3>SNEAKER 03</h3>
                        <p>$219.00</p>
                    </div>
                </div>
            </div>
        </section>

        <hr class="heavy-rule">

        <!-- Section 3: Street Proof -->
        <section id="street" class="section street">
            <h2 class="display-heading section-title">STREET PROOF</h2>
            <div class="film-strip">
                <img src="https://picsum.photos/seed/urban/800/600" alt="UGC 1" loading="lazy">
                <img src="https://picsum.photos/seed/street/800/600" alt="UGC 2" loading="lazy">
                <img src="https://picsum.photos/seed/city/800/600" alt="UGC 3" loading="lazy">
                <img src="https://picsum.photos/seed/lifestyle/800/600" alt="UGC 4" loading="lazy">
            </div>
        </section>
    </div>

    <!-- Section 4: Footer Checkout -->
    <footer class="checkout-bar">
        <div class="checkout-container">
            <div class="price-total">TOTAL: <span id="total-price">$0.00</span></div>
            <button class="cta-button checkout-btn">CHECKOUT NOW</button>
            <div class="cart-qty">CART: <span id="cart-count">0</span></div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
