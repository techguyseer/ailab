<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jino Noodle | Brutalist Heat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="brutalist-nav">
        <div class="nav-content">
            <a href="#hero">HOME</a>
            <a href="#scale">THE SCALE</a>
            <a href="#fame">FAME</a>
            <a href="#buy">BUY NOW</a>
        </div>
    </nav>

    <main>
        <section id="hero" class="brutalist-section">
            <div class="video-container">
                <video autoplay muted loop playsinline poster="https://picsum.photos/seed/steam/1920/1080">
                    <source src="" type="video/mp4">
                </video>
                <div class="overlay"></div>
            </div>
            <h1 class="hero-title">JINO NOODLE</h1>
        </section>

        <section id="scale" class="brutalist-section">
            <div class="grid-container">
                <div class="col-left">
                    <h2>THE SCALE</h2>
                    <p>SENSE THE HEAT. CHOOSE YOUR LEVEL.</p>
                </div>
                <div class="col-right">
                    <div class="slider-wrapper">
                        <input type="range" id="scale-input" min="1" max="3" step="1" value="1">
                        <div id="level-display">1</div>
                    </div>
                </div>
            </div>
        </section>

        <section id="fame" class="brutalist-section">
            <h2 class="skewed-title">WALL OF FAME</h2>
            <div class="masonry-grid" id="ugc-feed">
                <!-- Populated by JS -->
            </div>
        </section>

        <footer id="buy" class="brutalist-footer">
            <div class="cta-grid">
                <a href="#" class="cta-block">AMAZON</a>
                <a href="#" class="cta-block">WALMART</a>
                <a href="#" class="cta-block">TARGET</a>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
