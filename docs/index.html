<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immersive Experience</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <header id="main-nav">
        <nav>
            <div class="nav-links">
                <a href="#shop">Shop</a>
                <a href="#about">About</a>
                <a href="#account">Account</a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-overlay"></div>
        <img src="https://picsum.photos/seed/hero/1920/1080" alt="Hero Cinematic" class="hero-media">
        <h1 class="hero-title">The Atmosphere</h1>
    </section>

    <section id="shop" class="product-grid">
        <div class="product-item" data-fade>
            <div class="product-image-container">
                <img src="https://picsum.photos/seed/minimal/800/1000" alt="Minimal Product">
                <div class="hover-label">View Details</div>
            </div>
            <p class="product-desc">Minimalist Essence</p>
        </div>
        <div class="product-item" data-fade>
            <div class="product-image-container">
                <img src="https://picsum.photos/seed/structure/800/1000" alt="Structural Product">
                <div class="hover-label">View Details</div>
            </div>
            <p class="product-desc">Structural Geometry</p>
        </div>
        <div class="product-item" data-fade>
            <div class="product-image-container">
                <img src="https://picsum.photos/seed/geometry/800/1000" alt="Geometric Product">
                <div class="hover-label">View Details</div>
            </div>
            <p class="product-desc">Geometric Form</p>
        </div>
    </section>

    <footer id="about">
        <div class="footer-content">
            <h2>The Guestlist</h2>
            <form id="email-form">
                <input type="email" placeholder="Email Address" required>
                <button type="submit">Join</button>
            </form>
            <div id="form-thanks" class="hidden">Thank You.</div>
            <div class="legal">
                <a href="#">Terms</a>
                <a href="#">Privacy</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
